---
invoice_material: >-
  {{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'INVOICE_MATERIAL_FILE')) | from_json }}
python_application_root: /opt/invoice-portal
python_application_service: invoice-portal
python_application_user: invoice-portal
python_application_port: 80
python_application_source: "{{ playbook_dir }}/../files/invoice/"
python_application_source_revision: "{{ invoice_execution_revision }}"
python_application_artifact: "{{ invoice_material[invoice_release_channel] }}"
python_application_package: PyPDF2
python_application_approved_sha256: "{{ invoice_material[invoice_release_channel].sha256 }}"
python_application_approved_version: "{{ invoice_material[invoice_release_channel].version }}"
python_application_compatible_wheels:
  - "{{ invoice_material[invoice_release_channel].filename }}"
python_application_repository_username: "{{ invoice_material.repository_username | default('') }}"
python_application_repository_token: "{{ invoice_material.repository_token | default('') }}"
python_application_signing_key: "{{ lookup('ansible.builtin.env', 'INVOICE_SIGNING_KEY_FILE') }}"
python_application_signing_key_sha256: "{{ invoice_material.signing_key_sha256 | default('') }}"
python_application_command:
  - "{{ python_application_root }}/current/venv/bin/python"
  - "{{ python_application_root }}/current/app/portal.py"
  - --port
  - "{{ python_application_port | string }}"
python_application_environment:
  INVOICE_PROCESS_TIMEOUT: "2"
python_application_probe_argv:
  - "{{ python_application_python }}"
  - "{{ python_application_root }}/current/app/probe.py"
  - http://127.0.0.1:{{ python_application_port }}
  - --expect
  - >-
    {{ 'remediated' if invoice_release_channel == 'lightwell' else invoice_material.profile.validation.baseline_expectation
    | default('remediated') }}
  - --expected-wheel-sha256
  - "{{ python_application_approved_sha256 }}"
