---
dependency:
  name: galaxy
  enabled: true
  options:
    role-file: extensions/molecule/requirements-test.yml
    requirements-file: extensions/molecule/requirements-test.yml
ansible:
  cfg:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
  executor:
    args:
      ansible_playbook:
        - --inventory=../utils/inventory/base/
        - --inventory=../utils/inventory/${PROVISIONER:-kubevirt}/
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
  playbooks:
    create: ../utils/playbooks/create.yml
    destroy: ../utils/playbooks/destroy.yml
    prepare: ../utils/playbooks/prepare.yml
    converge: converge.yml
    verify: verify.yml
scenario:
  # Every separate provisioning command starts from new, owned test guests.
  # Idempotence remains a second converge inside the same fresh test lifecycle.
  create_sequence:
    - dependency
    - destroy
    - create
    - prepare
  converge_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
  check_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  test_sequence:
    - dependency
    - syntax
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible
