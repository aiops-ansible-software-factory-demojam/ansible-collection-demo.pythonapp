---
argument_specs:
  main:
    short_description: Shared Lightwell policy variables for all entry points
    description:
      - Controller-side role that reads operator material and vendor feeds; it does not change target hosts.
      - Import a specific tasks_from entry (discover, assess, or release) instead of relying on this default spec
        alone.
    author:
      - ansible software factory demojam
    options:
      lightwell_advisory_archive:
        description: HTTPS URL of the pinned Lightwell OSV advisory feed archive (GitHub codeload tarball for the
          resolved revision).
        type: str
        version_added: 0.1.0
      lightwell_advisory_revision:
        description: Immutable Git commit of the public Lightwell OSV feed; empty on new preparation resolves and
          pins the vendor main head.
        type: str
        version_added: 0.1.0
      lightwell_base_version:
        description: Upstream version receiving the vendor backport; defaults to the baseline version in prepared
          material.
        type: str
        version_added: 0.1.0
      lightwell_index_origin:
        description: Origin URL of the authenticated vendor Python index; repository credentials are taken from
          lightwell_material.
        type: str
        default: https://packages.redhat.com
        version_added: 0.1.0
      lightwell_material:
        description: Parsed JSON from INVOICE_MATERIAL_FILE with application profile, baseline, optional approved
          wheel, and private index credentials.
        type: dict
        version_added: 0.1.0
        required: true
        no_log: true
        options:
          profile: &id001
            description: Operator-approved application and vulnerability policy.
            type: dict
            required: true
            options:
              schema_version:
                description: Supported policy schema.
                type: int
                required: true
                choices:
                  - 1
              application:
                description: Application identity and source contract.
                type: dict
                required: true
                options:
                  id:
                    description: Application identifier; task validation restricts safe characters.
                    type: str
                    required: true
                  release_manifest:
                    description: Relative release manifest path.
                    type: str
                  inventory_group:
                    description: Production inventory group for this application.
                    type: str
                  repository:
                    description: Application collection repository associated with the incident.
                    type: str
                  python_executable:
                    description: Installed application Python interpreter used for dependency observations.
                    type: path
                  status_path:
                    description: Application dependency status endpoint path.
                    type: str
                  service:
                    description: Application service managed by deployment and approved containment.
                    type: str
              environment:
                description: Environment associated with the incident.
                type: str
                required: true
              package:
                description: Distribution identity.
                type: dict
                required: true
                options:
                  name:
                    description: Distribution name.
                    type: str
                    required: true
              runtime:
                description: Approved runtime compatibility.
                type: dict
                required: true
                options:
                  wheel_tags:
                    description: Approved Python wheel tags.
                    type: list
                    required: true
                    elements: str
                  requires_python:
                    description: Approved requires-python metadata.
                    type: list
                    elements: str
                  python:
                    description: Approved Python runtime version.
                    type: str
              validation:
                description: Acceptance contract.
                type: dict
                required: true
                options:
                  scenario:
                    description: Molecule scenario.
                    type: str
                    required: true
                  business_checks:
                    description: Application business checks.
                    type: list
                    required: true
                    elements: dict
                  adapter:
                    description: Application-specific acceptance adapter.
                    type: str
                  baseline_expectation:
                    description: Expected vulnerability behavior of the production baseline.
                    type: str
                  regression:
                    description: Shared vulnerability regression request and expected application outcomes.
                    type: dict
                    options:
                      path:
                        description: Regression request endpoint path.
                        type: str
                      method:
                        description: Regression HTTP request method.
                        type: str
                      vulnerable_status:
                        description: Expected result before remediation.
                        type: str
                      remediated_status:
                        description: Expected result after remediation.
                        type: str
                      text_contains:
                        description: Expected business content after successful processing.
                        type: str
              advisories:
                description: Explicit vulnerability mappings.
                type: list
                required: true
                elements: dict
                options:
                  id:
                    description: Upstream vulnerability identifier.
                    type: str
                    required: true
                  source:
                    description: Advisory evidence source.
                    type: str
                    required: true
                  affected_versions:
                    description: Explicitly affected versions.
                    type: list
                    required: true
                    elements: str
                  fixed_versions:
                    description: Vendor-backed fixed versions.
                    type: list
                    elements: str
                  cvss_score:
                    description: Approved severity score used by response routing.
                    type: float
                  fix_evidence:
                    description: Source of the approved or vendor-discovered remediation mapping.
                    type: str
              response:
                description: Operator-approved vulnerability response and review policy.
                type: dict
                options:
                  high_severity_threshold:
                    description: Severity threshold used by response routing.
                    type: float
                  containment:
                    description: Approved temporary containment action.
                    type: str
                  review_in_days:
                    description: Days until a deferred finding requires review.
                    type: int
          baseline:
            description: Baseline dependency identity.
            type: dict
            options: &id002
              version:
                description: Baseline upstream version.
                type: str
                required: true
              channel:
                description: Origin of the deliberately vulnerable baseline artifact.
                type: str
              package:
                description: Baseline distribution name.
                type: str
              base_version:
                description: Upstream baseline version receiving a vendor backport.
                type: str
              filename:
                description: Pinned baseline wheel filename.
                type: str
              url:
                description: Pinned baseline wheel download URL.
                type: str
              sha256:
                description: Approved baseline wheel SHA256 digest.
                type: str
              cves:
                description: Vulnerabilities associated with the baseline.
                type: list
                elements: str
          repository_username:
            description: Private package-index username.
            type: str
            no_log: true
          repository_token:
            description: Private package-index token.
            type: str
            no_log: true
          lightwell:
            description: Optional discovery pin or approved Lightwell artifact; empty means no selection.
            type: dict
            options: &id003
              channel:
                description: Selected artifact channel.
                type: str
                choices:
                  - lightwell
              package:
                description: Selected artifact package.
                type: str
              version:
                description: Selected artifact version.
                type: str
              filename:
                description: Selected artifact filename.
                type: str
              sha256:
                description: Selected artifact sha256.
                type: str
              url:
                description: Selected artifact url.
                type: str
              provenance_url:
                description: Selected artifact provenance url.
                type: str
              cves:
                description: Covered upstream vulnerabilities.
                type: list
                elements: str
              base_version:
                description: Upstream version receiving the selected vendor backport.
                type: str
              advisory_revision:
                description: Immutable vendor feed revision used for discovery.
                type: str
              advisories:
                description: Vendor advisory identifiers covering the selected wheel.
                type: list
                elements: str
              advisory_mapping_available:
                description: Whether vendor-backed vulnerability coverage was discovered.
                type: bool
          signing_key_sha256:
            description: Independently pinned public signing-key SHA256; preserved during discovery.
            type: str
  assess:
    short_description: Classify an installed version against prepared advisory mappings
    description:
      - Requires lightwell_installed with the observed package name and version from the target runtime.
      - Validates prepared material when an approved Lightwell selection is present, then returns lightwell_finding
        without repository secrets.
    author:
      - ansible software factory demojam
    options:
      lightwell_installed:
        description: Observed installed distribution on the target, collected independently of vendor feeds.
        type: dict
        required: true
        options:
          package:
            type: str
            required: true
            description: Installed distribution name; normalized and compared to the profile package.
          version:
            type: str
            required: true
            description: Exact installed version string; versions outside advisory mappings remain unknown.
      lightwell_material:
        description: Operator-prepared application profile, baseline, and optional approved Lightwell wheel, including
          private repository credentials.
        type: dict
        required: true
        no_log: true
        options:
          profile: *id001
          baseline:
            description: Baseline dependency identity.
            type: dict
            options: *id002
          repository_username:
            description: Private package-index username.
            type: str
            no_log: true
          repository_token:
            description: Private package-index token.
            type: str
            no_log: true
          lightwell:
            description: Optional discovery pin or approved Lightwell artifact; empty means no selection.
            type: dict
            options: *id003
          signing_key_sha256:
            description: Independently pinned public signing-key SHA256; preserved during discovery.
            type: str
  discover:
    short_description: Discover compatible vendor-advised Lightwell wheels
    description: &id004
      - Joins the pinned public Lightwell OSV feed to the authenticated PEP 691 index for the profile package and
        backport base.
      - Returns lightwell_candidates, at most one lightwell_selection, and private lightwell_discovered_material;
        signing trust is not decided here.
    author: &id005
      - ansible software factory demojam
    options:
      lightwell_advisory_archive: &id006
        description: HTTPS URL of the advisory feed archive to download after the feed revision is pinned; override
          only for an isolated trusted fixture.
        type: str
      lightwell_advisory_revision: &id007
        description: Immutable Git commit of the public Lightwell OSV feed; empty resolves and pins the current
          vendor main head before download.
        type: str
      lightwell_base_version: &id008
        description: Upstream version receiving the vendor backport; must match advisory and index metadata for
          candidate wheels.
        type: str
        required: true
      lightwell_index_origin: &id009
        description: Origin URL of the authenticated vendor Python index; production uses https://packages.redhat.com
          with credentials from lightwell_material.
        type: str
        default: https://packages.redhat.com
      lightwell_material: &id010
        description: Operator-prepared application profile, baseline, and optional pin of version, filename, and
          SHA256 for an approved wheel.
        type: dict
        required: true
        no_log: true
        options:
          profile: *id001
          baseline:
            description: Baseline dependency identity.
            type: dict
            required: true
            options: *id002
          repository_username:
            description: Private package-index username.
            type: str
            required: true
            no_log: true
          repository_token:
            description: Private package-index token.
            type: str
            required: true
            no_log: true
          lightwell:
            description: Optional discovery pin or approved Lightwell artifact; empty means no selection.
            type: dict
            options: *id003
          signing_key_sha256:
            description: Independently pinned public signing-key SHA256; preserved during discovery.
            type: str
  release:
    short_description: Validate a candidate release lock against approved material
    description:
      - Reads a controller-local JSON release manifest and asserts it locks exactly one Lightwell dependency matching
        prepared material.
      - Returns lightwell_release_sha256 as the canonical hash of the validated manifest.
    author:
      - ansible software factory demojam
    options:
      lightwell_material:
        description: Operator-prepared application profile, baseline, and approved Lightwell wheel identity (package,
          version, SHA256).
        type: dict
        required: true
        no_log: true
        options:
          profile: *id001
          baseline:
            description: Baseline dependency identity.
            type: dict
            options: *id002
          repository_username:
            description: Private package-index username.
            type: str
            no_log: true
          repository_token:
            description: Private package-index token.
            type: str
            no_log: true
          lightwell:
            description: Optional discovery pin or approved Lightwell artifact; empty means no selection.
            type: dict
            required: true
            options:
              channel:
                description: Selected artifact channel.
                type: str
                required: true
                choices:
                  - lightwell
              package:
                description: Selected artifact package.
                type: str
                required: true
              version:
                description: Selected artifact version.
                type: str
                required: true
              filename:
                description: Selected artifact filename.
                type: str
                required: true
              sha256:
                description: Selected artifact sha256.
                type: str
                required: true
              url:
                description: Selected artifact url.
                type: str
                required: true
              provenance_url:
                description: Selected artifact provenance url.
                type: str
                required: true
              cves:
                description: Covered upstream vulnerabilities.
                type: list
                required: true
                elements: str
              base_version:
                description: Upstream version receiving the selected vendor backport.
                type: str
              advisory_revision:
                description: Immutable vendor feed revision used for discovery.
                type: str
              advisories:
                description: Vendor advisory identifiers covering the selected wheel.
                type: list
                elements: str
              advisory_mapping_available:
                description: Whether vendor-backed vulnerability coverage was discovered.
                type: bool
          signing_key_sha256:
            description: Independently pinned public signing-key SHA256; preserved during discovery.
            type: str
      lightwell_release_file:
        description: Controller-local path to the candidate JSON release manifest; must lock the approved package,
          version, and wheel SHA256.
        type: path
        required: true
  prepare:
    short_description: Discover and securely write prepared Lightwell material
    description: *id004
    author: *id005
    options:
      lightwell_advisory_archive: *id006
      lightwell_advisory_revision: *id007
      lightwell_base_version: *id008
      lightwell_index_origin: *id009
      lightwell_material: *id010
      lightwell_material_output:
        type: path
        required: true
        description: Controller-local path for private prepared material.
