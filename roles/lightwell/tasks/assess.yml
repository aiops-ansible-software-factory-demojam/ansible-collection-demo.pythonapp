---
- name: Validate assessment inputs
  ansible.builtin.import_tasks: inputs.yml

- name: Validate an available Lightwell selection
  ansible.builtin.include_tasks: artifact.yml
  when: lightwell_material.lightwell | default({}) | length > 0

- name: Require the observed package to match the configured application
  ansible.builtin.assert:
    that:
      - lightwell_installed.package | lower | regex_replace('[-_.]+', '-') == __lightwell_package

- name: Initialize version assessment
  ansible.builtin.set_fact:
    __lightwell_affected: []
    __lightwell_fixed: true

- name: Assess each explicit advisory mapping
  ansible.builtin.set_fact:
    __lightwell_affected: "{{ __lightwell_affected + ([item.id] if lightwell_installed.version in item.affected_versions else []) }}"
    __lightwell_fixed: "{{ __lightwell_fixed and lightwell_installed.version in item.fixed_versions | default([]) }}"
  loop: "{{ lightwell_material.profile.advisories }}"
  loop_control:
    label: "{{ item.id }}"

- name: Preserve the incident identity across vulnerable and fixed observations
  ansible.builtin.set_fact:
    __lightwell_identity:
      application: "{{ lightwell_material.profile.application.id }}"
      environment: "{{ lightwell_material.profile.environment }}"
      package: "{{ __lightwell_package }}"
      advisories: "{{ __lightwell_advisories }}"

- name: Return the public finding without repository access material
  ansible.builtin.set_fact:
    lightwell_finding: >-
      {{ __lightwell_identity | combine({
      'schema_version': 1,
      'incident_key': __lightwell_identity | to_json(sort_keys=true) | hash('sha256'),
      'installed_version': lightwell_installed.version,
      'profile_sha256': lightwell_material.profile | to_json(sort_keys=true) | hash('sha256'),
      'assessment_state': 'affected' if __lightwell_affected else ('fixed' if __lightwell_fixed else 'unknown'),
      'affected': __lightwell_affected | length > 0,
      'fix_available': __lightwell_affected | length > 0 and lightwell_material.lightwell | default({}) | length > 0,
      'advisory_evidence': lightwell_material.profile.advisories,
      'candidate': dict(lightwell_material.lightwell | default({}) | dict2items |
        selectattr('key', 'in', ['channel', 'package', 'base_version', 'version', 'filename', 'url', 'sha256', 'provenance_url', 'cves']) |
        items2dict),
      'application_profile': lightwell_material.profile.application,
      'validation': lightwell_material.profile.validation}) }}
