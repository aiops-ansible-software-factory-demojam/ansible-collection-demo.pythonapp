---
- name: inputs | Validate the application policy inputs
  ansible.builtin.assert:
    that:
      - lightwell_material.profile.application.id is match('^[a-zA-Z0-9_-]+$')
      - lightwell_material.profile.environment | length > 0
      - lightwell_material.profile.package.name | length > 0
      - lightwell_material.profile.advisories | length > 0
      - lightwell_material.profile.runtime.wheel_tags | length > 0
      - lightwell_material.profile.validation.scenario | length > 0
      - lightwell_material.profile.validation.business_checks | length > 0
- name: inputs | Validate each vulnerability mapping
  ansible.builtin.assert:
    that:
      - __lightwell_advisory.id | length > 0
      - __lightwell_advisory.source | length > 0
      - __lightwell_advisory.affected_versions | length > 0
  loop: '{{ lightwell_material.profile.advisories }}'
  loop_control:
    loop_var: __lightwell_advisory
    label: '{{ __lightwell_advisory.id }}'
- name: inputs | Normalize package identity and required advisories
  ansible.builtin.set_fact:
    __lightwell_package: "{{ lightwell_material.profile.package.name | lower | regex_replace('[-_.]+', '-') }}"
    __lightwell_advisories: '{{ lightwell_material.profile.advisories | map(attribute="id") | sort | list }}'
