---
- name: Read a candidate vendor advisory
  ansible.builtin.slurp:
    src: '{{ lightwell_advisory_file.path }}'
  register: __lightwell_record_bytes
- name: Decode the vendor advisory
  ansible.builtin.set_fact:
    __lightwell_record: '{{ __lightwell_record_bytes.content | b64decode | from_json }}'
- name: Collect matching package and base-version remediation evidence
  ansible.builtin.include_tasks: advisory-package.yml
  loop: '{{ __lightwell_record.affected | default([]) }}'
  loop_control:
    loop_var: lightwell_affected_package
    label: '{{ lightwell_affected_package.package.name }}'
  when:
    - not __lightwell_record.withdrawn | default('')
    - __lightwell_record.id is match('^RHLW-')
    - lightwell_affected_package.package.ecosystem == 'Red Hat Lightwell:PyPI'
    - lightwell_affected_package.package.name | lower | regex_replace('[-_.]+', '-') == __lightwell_package
    - lightwell_affected_package.database_specific.lightwell.backport_base_version | default('') == lightwell_base_version
