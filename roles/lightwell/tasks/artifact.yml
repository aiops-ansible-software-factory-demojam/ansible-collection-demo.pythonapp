---
- name: Require a fully mapped immutable Lightwell selection
  ansible.builtin.assert:
    that:
      - lightwell_material.lightwell.channel == 'lightwell'
      - lightwell_material.lightwell.package | lower | regex_replace('[-_.]+', '-') == __lightwell_package
      - lightwell_material.lightwell.sha256 is match('^[0-9a-f]{64}$')
      - lightwell_material.lightwell.cves | sort == __lightwell_advisories
      - lightwell_material.lightwell.filename is match('^[A-Za-z0-9_.+-]+\.whl$')
      - lightwell_material.lightwell.filename.split('-')[1] == lightwell_material.lightwell.version
      - lightwell_material.lightwell.filename.split('-')[0] | lower | regex_replace('[-_.]+', '-') == __lightwell_package
      - >-
        lightwell_material.lightwell.filename | regex_search('-(' +
        (lightwell_material.profile.runtime.wheel_tags | map('regex_escape') | join('|')) + ')\.whl$')
    fail_msg: The selection must match the package, runtime, digest and complete advisory set.
- name: Require independently approved advisory coverage for the selected version
  ansible.builtin.assert:
    that:
      - lightwell_material.lightwell.version in item.fixed_versions | default([])
  loop: '{{ lightwell_material.profile.advisories }}'
  loop_control:
    label: '{{ item.id }}'
- name: Restrict artifact and provenance URLs to the trusted repository
  ansible.builtin.assert:
    that:
      - item | urlsplit('scheme') == 'https'
      - item | urlsplit('hostname') == 'packages.redhat.com'
      - not item | urlsplit('username')
      - not item | urlsplit('password')
      - not item | urlsplit('query')
      - not item | urlsplit('fragment')
  loop:
    - '{{ lightwell_material.lightwell.url }}'
    - '{{ lightwell_material.lightwell.provenance_url }}'
