---
- name: Check for cloud-init on the application guest
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: python_application_cloud_init

- name: Wait for boot configuration before package installation
  ansible.builtin.command:
    argv:
      - /usr/bin/cloud-init
      - status
      - --wait
  when: python_application_cloud_init.stat.exists
  changed_when: false
  failed_when: python_application_boot.rc != 0
  register: python_application_boot
  timeout: 600

- name: Install the RHEL Python runtime
  ansible.builtin.package:
    name: "{{ python_application_python_packages }}"
    state: present

- name: Require SELinux enforcing
  ansible.builtin.command:
    cmd: getenforce
  changed_when: false
  failed_when: python_application_selinux.stdout | trim != 'Enforcing'
  register: python_application_selinux

- name: Create the application service account
  ansible.builtin.user:
    name: "{{ python_application_user }}"
    system: true
    create_home: false
    shell: /sbin/nologin
    state: present

- name: Prepare the selected release once
  ansible.builtin.include_tasks: prepare-release.yml
  when: not __python_application_release.stat.exists

- name: Check the currently installed service definition
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ python_application_service }}.service
  register: python_application_previous_unit

- name: Preserve the previous service definition for recovery
  ansible.builtin.slurp:
    src: /etc/systemd/system/{{ python_application_service }}.service
  when: python_application_previous_unit.stat.exists
  register: python_application_previous_unit_content
  no_log: true

- name: Discover the current release
  ansible.builtin.stat:
    path: "{{ python_application_root }}/current"
  register: python_application_current

- name: Activate and verify the selected release
  block:
    - name: Install the hardened application service
      ansible.builtin.template:
        src: application.service.j2
        dest: /etc/systemd/system/{{ python_application_service }}.service
        owner: root
        group: root
        mode: "0644"
      register: python_application_unit
      no_log: true

    - name: Select the application release
      ansible.builtin.file:
        src: "{{ python_application_root }}/releases/{{ python_application_release_id }}"
        dest: "{{ python_application_root }}/current"
        state: link
        force: true
        mode: "0644"
      register: python_application_switch

    - name: Start the Python application
      ansible.builtin.systemd_service:
        name: "{{ python_application_service }}"
        daemon_reload: "{{ python_application_unit.changed }}"
        enabled: true
        state: >-
          {{ 'restarted' if python_application_switch.changed or python_application_unit.changed else 'started' }}

    - name: Wait for the application health endpoint
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ python_application_port }}{{ python_application_health_path }}
        status_code: 200
      register: python_application_health
      until: python_application_health.status | default(0) == 200
      retries: 10
      delay: 2

    - name: Verify the exact deployed artifact and application behavior
      ansible.builtin.command:
        argv: "{{ python_application_probe_argv }}"
      changed_when: false
      register: python_application_verification

    - name: Publish verified release facts
      ansible.builtin.set_fact:
        python_application_evidence: "{{ python_application_verification.stdout | from_json }}"
  rescue:
    - name: Restore the previous release after failed validation
      ansible.builtin.file:
        src: "{{ python_application_current.stat.lnk_source }}"
        dest: "{{ python_application_root }}/current"
        state: link
        force: true
        mode: "0644"
      when: python_application_current.stat.islnk | default(false)

    - name: Restore the previous service definition
      ansible.builtin.copy:
        content: "{{ python_application_previous_unit_content.content | b64decode }}"
        dest: /etc/systemd/system/{{ python_application_service }}.service
        owner: root
        group: root
        mode: "0644"
      when: python_application_previous_unit.stat.exists
      no_log: true

    - name: Restart the restored release
      ansible.builtin.systemd_service:
        name: "{{ python_application_service }}"
        state: restarted
        daemon_reload: true
      when: python_application_current.stat.islnk | default(false)

    - name: Stop a failed initial release when there is no previous release
      ansible.builtin.systemd_service:
        name: "{{ python_application_service }}"
        state: stopped
      when: not (python_application_current.stat.islnk | default(false))

    - name: Verify the previous release responds after restoration
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ python_application_port }}{{ python_application_health_path }}
        status_code: 200
      when: python_application_current.stat.islnk | default(false)
      register: python_application_restored
      until: python_application_restored.status | default(0) == 200
      retries: 10
      delay: 2

    - name: Report the unsuccessful deployment
      ansible.builtin.fail:
        msg: Application release validation failed. A previous release was restored when available; the incident remains unresolved. Inspect AAP job output 
          before another deployment.
